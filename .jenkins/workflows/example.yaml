# .jenkins/workflows/ci.yaml — place this file in your consuming repo
#
# All fields are optional; omitted fields fall back to library defaults.
# Only override what you need.

name: "my-service"
# Note: the agent label cannot be set here — the YAML is only read after node
# allocation. Pass it in your Jenkinsfile: ciPipeline(agent: 'my-label')

options:
  timeout: 45                    # minutes; default: 60
  disableConcurrentBuilds: true
  abortPreviousBuilds: true      # cancel older PR builds when new commit arrives
  buildsToKeep: 30

stages:

  # ── Checkout ────────────────────────────────────────────────────────────────
  checkout:
    enabled: true
    submodules: false
    lfs: false
    printCommitInfo: true

  # ── Build ────────────────────────────────────────────────────────────────────
  build:
    enabled: true
    tool: gradle                 # gradle | maven | nodejs | docker
    # On Kubernetes pod agents, run build/test/scan steps inside this pod
    # container (its image provides the JDK/tools). Ignored on classic agents,
    # which fall back to jdkVersion / nodeVersion tool installations instead —
    # set both to support both agent types with one config.
    container: jdk17
    gradle:
      tasks: "clean build -x test"
      jdkVersion: "17"           # classic agents: Jenkins JDK tool named "jdk-17"
      gradleOpts: "-Xmx2g -Dfile.encoding=UTF-8"
      # HTTP proxy is auto-detected from HTTP(S)_PROXY / NO_PROXY env on the
      # agent and passed to Gradle as JVM -D flags; set this block only to
      # override that:
      # proxy:
      #   host: 192.168.0.89
      #   port: 10809
      #   noProxy: "localhost,127.0.0.1,.svc.cluster.local"
    # maven:
    #   goals: "clean package -DskipTests"
    #   mavenOpts: "-Xmx2g"
    #   profiles: ["ci"]
    # nodejs:
    #   nodeVersion: "20"
    #   packageManager: npm      # npm | yarn
    #   buildScript: build
    # Language-agnostic pattern (rust / go / python / anything): build AND
    # test inside a multi-stage Dockerfile, no native builder needed. The
    # pipeline always passes --build-arg CACHE_NAMESPACE=<repo-slug> — use it
    # in cache-mount ids to scope per-repo artifact caches (cargo target/);
    # package-manager caches are content-addressed and stay global.
    # docker:
    #   target: runtime          # final multi-stage target
    #   image: ghcr.io/openprojectx/my-service
    #   tag: "${IMAGE_TAG}"      # default: IMAGE_TAG, then BUILD_NUMBER
    #   push: true
    #   registry:
    #     url: ghcr.io
    #     credentialsId: ghcr-token
    #   # Dockerfile sketch:
    #   #   ARG CACHE_NAMESPACE=default
    #   #   FROM rust:1 AS builder
    #   #   RUN --mount=type=cache,id=${CACHE_NAMESPACE}-cargo-registry,target=/usr/local/cargo/registry \
    #   #       --mount=type=cache,id=${CACHE_NAMESPACE}-cargo-git,target=/usr/local/cargo/git \
    #   #       --mount=type=cache,id=${CACHE_NAMESPACE}-cargo-target,target=/app/target,sharing=locked \
    #   #       cargo build --release && cargo test      # tests run in the build
    #   #   FROM debian:bookworm-slim AS runtime
    #   #   COPY --from=builder /app/target/release/my-svc /usr/local/bin/
    # unit-test:                 # or extract JUnit from a test image:
    #   docker:
    #     command: "docker run --rm -v $PWD/test-results:/test-results my-image:test"
    #   reports:
    #     junit: "test-results/*.xml"
    # Optional: inject Jenkins credentials as masked env vars for the build.
    # The credential must exist in Jenkins (global or folder scope) with a
    # matching ID. Three binding shapes:
    #   - credentialsId + envVar                  -> secret text, one env var
    #   - credentialsId + usernameVar/passwordVar -> username/password pair
    #   - credentialsId + variable                -> secret file (env var = path)
    # credentials:
    #   - credentialsId: npm-token
    #     envVar: NPM_TOKEN
    #   - credentialsId: harbor-login
    #     usernameVar: REG_USER
    #     passwordVar: REG_PASS
    archiveArtifacts: "**/build/libs/*.jar"

  # ── Release Metadata ────────────────────────────────────────────────────────
  # Optional SDLC metadata stage. It runs before build/deploy and exports:
  # RELEASE_TYPE, RELEASE_VERSION, IMAGE_TAG, BRANCH_SLUG, SHORT_SHA.
  release:
    enabled: true
    defaultType: snapshot
    snapshot:
      branches: ["feature/*", "sandbox/*", "develop"]
      version: "0.0.0-${BRANCH_SLUG}.${BUILD_NUMBER}.${SHORT_SHA}"
      imageTag: "${RELEASE_VERSION}"
    formal:
      branches: ["main", "master"]
      tags: ["v*"]
      version: "${TAG_NAME}"
      imageTag: "${RELEASE_VERSION}"

  # ── Unit Test ────────────────────────────────────────────────────────────────
  unit-test:
    enabled: true
    # credentials:               # defaults to the build stage list when unset
    #   - credentialsId: test-db-password
    #     envVar: TEST_DB_PASSWORD
    gradle:
      tasks: "test jacocoTestReport"
    reports:
      junit: "**/build/test-results/**/*.xml"
    # archiveArtifacts: "**/build/reports/tests/**"   # keep HTML reports on the build page
    # archiveTar: true             # bundle matches into one <stage>-reports.tar.gz (or set a custom name)

  # ── Scan ─────────────────────────────────────────────────────────────────────
  scan:
    sonar:
      enabled: true
      serverName: SonarQube      # matches Jenkins SonarQube server name
      projectKey: "my-service"
      qualityGateWait: true
      timeout: 5                 # minutes to wait for quality gate
      # extraProperties: "-Dsonar.coverage.exclusions=**/generated/**"
    trivy:
      enabled: true
      image: "my-registry/my-service:${IMAGE_TAG}"
      severity: "CRITICAL,HIGH"
      exitCode: 1                # set to 0 to warn-only
      ignoreFile: ".trivyignore"

  # ── Deploy ───────────────────────────────────────────────────────────────────
  deploy:
    enabled: true
    kubeCredentialsId: kube-config-secret   # global fallback kubeconfig credential

    environments:

      - name: dev
        branches: ["develop", "feature/*"]
        tool: helm
        kubeCredentialsId: kube-config-dev  # per-env override
        helm:
          chart: "./charts/my-service"
          release: "my-service-dev"
          namespace: "dev"
          kubeContext: "dev-cluster"
          values:
            - values.yaml
            - values-dev.yaml
          set:
            image.tag: "${IMAGE_TAG}"
          extraArgs: "--wait --timeout 5m"

      - name: staging
        branches: ["main"]
        tool: kustomize
        kustomize:
          path: "./k8s/overlays/staging"
          namespace: "staging"
          kubeContext: "staging-cluster"

      - name: prod
        branches: ["main"]
        tool: helm
        helm:
          chart: "./charts/my-service"
          release: "my-service"
          namespace: "prod"
          kubeContext: "prod-cluster"
          values:
            - values.yaml
            - values-prod.yaml
          set:
            image.tag: "${IMAGE_TAG}"
          extraArgs: "--wait --timeout 10m --atomic"

  # ── Integration Test ─────────────────────────────────────────────────────────
  integration-test:
    enabled: false
    command: "make integration-test"
    timeout: 30
    reports:
      junit: "**/build/integration-test-results/**/*.xml"
    # archiveArtifacts: "**/build/reports/integrationTest/**"

  # ── PR Gate ───────────────────────────────────────────────────────────────────
  pr-gate:
    enabled: true
    provider: github             # github | bitbucket
    github:
      credentialsId: github-token
      statusContext: "ci/jenkins"
      requiredChecks: []         # additional required check names
    # bitbucket:
    #   credentialsId: bitbucket-token
    #   buildKey: jenkins-ci
