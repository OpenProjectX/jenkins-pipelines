# Default pipeline configuration — merged with user's .jenkins/workflows/ci.yaml
# Values here are overridden by the consuming repo's ci.yaml
name: jenkins-pipeline
# Note: the agent label is NOT configurable here — pass it to the pipeline
# entry point instead: ciPipeline(agent: 'my-label'). The YAML is only read
# after node allocation, so it cannot influence which node is used.

options:
  timeout: 60
  disableConcurrentBuilds: true
  abortPreviousBuilds: false
  buildsToKeep: 20
  artifactsToKeep: 5

stages:
  checkout:
    enabled: true
    submodules: false
    lfs: false
    shallow: true
    depth: 10
    printCommitInfo: true

  build:
    enabled: true
    tool: gradle
    # Optional: inject arbitrary Jenkins credentials as masked env vars for the
    # build stage (any tool). Secret text, username/password, and secret file
    # bindings are supported. unit-test inherits this list unless it defines
    # its own.
    # credentials:
    #   - credentialsId: npm-token
    #     envVar: NPM_TOKEN
    #   - credentialsId: harbor-login
    #     usernameVar: REG_USER
    #     passwordVar: REG_PASS
    #   - credentialsId: some-file
    #     variable: MY_SECRET_FILE
    # Omit container when the Kubernetes pod template uses the all-in-one
    # ghcr.io/openprojectx/jenkins-build-agent image as its jnlp container.
    # Set container only for legacy sidecar pod templates, e.g. container: jdk17.
    gradle:
      tasks: "clean build -x test"
      jdkVersion: "17"
      gradleOpts: "-Xmx2g"
    docker:
      context: "."
      dockerfile: Dockerfile
      buildKit: true
      push: false
      # cacheNamespace: my-repo   # default: JOB_BASE_NAME; scopes the
      #                           # CACHE_NAMESPACE build arg for cache mounts

  release:
    enabled: false
    defaultType: snapshot
    snapshot:
      branches: ["feature/*", "sandbox/*", "develop"]
      version: "0.0.0-${BRANCH_SLUG}.${BUILD_NUMBER}.${SHORT_SHA}"
    formal:
      branches: ["main", "master"]
      tags: ["v*"]
      version: "${TAG_NAME}"

  unit-test:
    enabled: true
    gradle:
      tasks: "test"
    docker: {}
    reports:
      junit: "**/build/test-results/**/*.xml"

  scan:
    sonar:
      enabled: false
      serverName: SonarQube
      qualityGateWait: true
      timeout: 5
    trivy:
      enabled: false
      severity: "CRITICAL,HIGH"
      exitCode: 1

  deploy:
    enabled: false
    environments: []

  integration-test:
    enabled: false
    timeout: 30

  pr-gate:
    enabled: true
    provider: github
    github:
      credentialsId: github-token
      statusContext: ci/jenkins
    bitbucket:
      credentialsId: bitbucket-token
      buildKey: jenkins-ci
